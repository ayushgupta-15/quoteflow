# Local Postgres for QuoteFlow. Matches the default DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quoteflow
      POSTGRES_PASSWORD: quoteflow
      POSTGRES_DB: quoteflow
    ports:
      - "54329:5432"
    volumes:
      - quoteflow-data:/var/lib/postgresql/data
volumes:
  quoteflow-data:
